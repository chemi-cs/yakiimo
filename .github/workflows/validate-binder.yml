name: Validate Binder backup

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .binder/requirements.txt
      - name: Install Binder lesson dependencies
        run: python -m pip install -r .binder/requirements.txt ipykernel
      - name: Check and execute the lesson
        run: python scripts/validate_notebook.py --execute
